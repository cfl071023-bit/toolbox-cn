name: Build, verify and deploy ToolBox CN
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for repository Pages path
        run: npm run build
        env:
          TOOLBOX_BASE_PATH: /toolbox-cn/
      - run: npx playwright install --with-deps chromium
      - name: Verify static Pages paths, tools and corresponding source
        run: node scripts/pages-smoke.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.repository == 'cfl071023-bit/toolbox-cn'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
